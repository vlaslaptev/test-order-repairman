name: Feature request
description: Suggest an improvement with a concrete use case.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before proposing a change.
        Please review the [current scope and compatibility](https://github.com/vlaslaptev/test-order-repairman#compatibility).
        Use synthetic examples and do not include private source code or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, and what is difficult with the current behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired workflow. Include a small before-and-after example if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Environment and additional context
      description: Include plugin, IDE, language, and framework versions if they affect the proposal. Screenshots are optional; describe them in text.
