</g><text x="144" y="83" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17233B" >Test Order Repairman</text><text x="1512" y="82" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#58657B" text-anchor="end" letter-spacing="1.7">JAVA / JUNIT JUPITER</text><text x="88" y="192" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#17233B" letter-spacing="-1.8">One class. A focused change.</text><text x="88" y="246" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#58657B" >Renumber the selected class while other scopes keep their own values.</text><text x="88" y="977" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#58657B" >Illustrated code examples · Test Order Repairman</text><text x="1512" y="977" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#58657B" text-anchor="end">02 / 04</text><rect x="88" y="302" width="800" height="548" rx="16" fill="#2B2B2B"/><rect x="88" y="302" width="800" height="62" rx="16" fill="#242424"/><rect x="88" y="340" width="800" height="24" rx="0" fill="#242424"/><text x="116" y="342" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#91D5A0" letter-spacing="1.2">SELECTED CLASS / AFTER</text><text x="860" y="342" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A6" text-anchor="end">Outer.java · excerpt</text><path d="M88 364H888" fill="none" stroke="#424242" stroke-width="1"/><text x="118" y="408" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve"><tspan fill="#BBB529">@Order</tspan>(<tspan fill="#6897BB">50</tspan>)</text><text x="118" y="451" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve"><tspan fill="#CC7832">class</tspan> Outer {</text><text x="118" y="494" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve">    <tspan fill="#BBB529">@Test</tspan> <tspan fill="#BBB529">@Order</tspan>(<tspan fill="#6897BB">1</tspan>)</text><text x="118" y="537" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve">    <tspan fill="#CC7832">void</tspan> <tspan fill="#A9B7C6">first</tspan>() {}</text><text x="118" y="580" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve"></text><rect x="102" y="592" width="772" height="42" rx="5" fill="#2D3B31"/><text x="118" y="623" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve">    <tspan fill="#BBB529">@Test</tspan> <tspan fill="#BBB529">@Order</tspan>(<tspan fill="#91D5A0">2</tspan>)</text><text x="118" y="666" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve">    <tspan fill="#CC7832">void</tspan> <tspan fill="#A9B7C6">second</tspan>() {}</text><text x="118" y="709" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve">    <tspan fill="#808080">// other members unchanged</tspan></text><text x="118" y="752" font-family="Menlo, monospace" font-size="27" fill="#BABABA" xml:space="preserve">}</text><rect x="944" y="302" width="568" height="121" rx="14" fill="#FFFFFF" stroke="#DCE3EF"/><text x="972" y="341" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17233B" >Nested classes</text><text x="972" y="383" font-family="Menlo, monospace" font-size="20" fill="#58657B" xml:space="preserve" >Inner: @Order(8), @Order(11)</text><circle cx="1472" cy="337" r="7" fill="#25814B"/><rect x="944" y="441" width="568" height="121" rx="14" fill="#FFFFFF" stroke="#DCE3EF"/><text x="972" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17233B" >Neighboring classes</text><text x="972" y="522" font-family="Menlo, monospace" font-size="20" fill="#58657B" xml:space="preserve" >Neighbor: @Order(5)</text><circle cx="1472" cy="476" r="7" fill="#25814B"/><rect x="944" y="580" width="568" height="121" rx="14" fill="#FFFFFF" stroke="#