ize="22.5" fill="#BABABA" xml:space="preserve">    <tspan fill="#CC7832">static</tspan> <tspan fill="#CC7832">final</tspan> <tspan fill="#CC7832">int</tspan> START = <tspan fill="#6897BB">7</tspan>;</text><text x="118" y="504" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve"></text><rect x="102" y="509.5" width="648" height="31" rx="5" fill="#3D302B"/><text x="118" y="536" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve">    <tspan fill="#BBB529">@Test</tspan> <tspan fill="#BBB529">@Order</tspan>(-<tspan fill="#F4AD91">5</tspan>)</text><text x="118" y="568" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve">    <tspan fill="#CC7832">void</tspan> <tspan fill="#A9B7C6">first</tspan>() {}</text><text x="118" y="600" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve"></text><text x="118" y="632" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve">    <tspan fill="#BBB529">@Test</tspan> <tspan fill="#BBB529">@Order</tspan>(SECOND)</text><text x="118" y="664" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve">    <tspan fill="#CC7832">void</tspan> <tspan fill="#A9B7C6">second</tspan>() {}</text><text x="118" y="696" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve"></text><rect x="102" y="701.5" width="648" height="31" rx="5" fill="#3D302B"/><text x="118" y="728" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve">    <tspan fill="#BBB529">@Test</tspan> <tspan fill="#BBB529">@Order</tspan>(value = <tspan fill="#808080">/* keep */</tspan> START + <tspan fill="#F4AD91">4</tspan>)</text><text x="118" y="760" font-family="Menlo, monospace" font-size="22.5" fill="#BABABA" xml:space="preserve">    <tspan fill="#CC7832">void</tspan> <tspan fill="#A9B7C6">third</tspan>() {}</text><text x="118" y="792" font-family="Men